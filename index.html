<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cracking the Cryptic — Sudoku Library</title>
<meta name="description" content="Every sudoku from Cracking the Cryptic in one searchable, installable app. Updated automatically.">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CTC Sudoku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">

  <header class="topbar">
    <div class="brand" id="brand" title="Back to library">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>
        </svg>
      </span>
      <span class="brand-text">Cryptic<span>Library</span></span>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search puzzles, setters…" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Search puzzles">
      <button class="clear" id="clearQ" aria-label="Clear search" hidden>&times;</button>
    </div>

    <button class="icon-btn" id="randomBtn" title="Random puzzle (R)" aria-label="Random puzzle">
      <svg viewBox="0 0 24 24"><path d="M16 3h5v5M21 3l-7.5 7.5M8 21H3v-5M3 21l7.5-7.5M16 21h5v-5M14 14l7 7M3 3l5 5"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg>
    </button>
  </header>

  <div class="controls">
    <div class="chips" id="tagChips" role="group" aria-label="Filter by constraint"></div>
    <div class="selects">
      <label class="pill">
        <span>Status</span>
        <select id="statusSel">
          <option value="all">All</option>
          <option value="new">New</option>
          <option value="unplayed">Unplayed</option>
          <option value="playing">In progress</option>
          <option value="solved">Solved</option>
          <option value="fav">Favourites</option>
        </select>
      </label>
      <label class="pill">
        <span>Setter</span>
        <select id="authorSel"><option value="">Anyone</option></select>
      </label>
      <label class="pill">
        <span>Sort</span>
        <select id="sortSel">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="name">A–Z</option>
          <option value="setter">Setter</option>
        </select>
      </label>
      <button class="pill ghost" id="resetBtn" hidden>Clear filters</button>
    </div>
  </div>

  <main class="list-wrap">
    <div class="resultbar">
      <span id="countLine">Loading library…</span>
      <span class="sync" id="syncLine"></span>
    </div>
    <ol class="list" id="list" aria-live="polite"></ol>
    <div class="sentinel" id="sentinel"></div>
    <div class="empty" id="empty" hidden>
      <p class="empty-title">No puzzles match that.</p>
      <p class="empty-sub">Try fewer filters or a shorter search.</p>
      <button class="btn" id="resetBtn2">Clear filters</button>
    </div>
    <footer class="site-foot">
      <p>Puzzles © their setters · index scraped from
        <a href="https://crackingthecryptic.com/sudokus" target="_blank" rel="noopener">crackingthecryptic.com</a>
        · played in <a href="https://sudokupad.app" target="_blank" rel="noopener">SudokuPad</a>.</p>
      <p class="muted" id="dataStamp"></p>
    </footer>
  </main>

  <!-- ── Player ─────────────────────────────────────────────── -->
  <section class="player" id="player" hidden aria-label="Puzzle">
    <header class="pbar">
      <button class="icon-btn" id="backBtn" aria-label="Back to library">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="ptext">
        <h1 id="pName">Puzzle</h1>
        <p id="pMeta"></p>
      </div>
      <button class="icon-btn star" id="favBtn" aria-label="Toggle favourite" title="Favourite (F)">
        <svg viewBox="0 0 24 24"><path d="m12 3.6 2.6 5.4 5.9.8-4.3 4.2 1 5.9-5.2-2.9-5.2 2.9 1-5.9L3.5 9.8l5.9-.8z"/></svg>
      </button>
      <button class="icon-btn" id="doneBtn" aria-label="Mark as solved" title="Mark solved">
        <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      </button>
    </header>

    <div class="stage" id="stage">
      <iframe id="pad" title="SudokuPad player" allow="clipboard-write; fullscreen" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="stage-note" id="stageNote" hidden></div>
    </div>

    <div class="pfoot" id="pfoot">
      <button class="chipbtn" id="rulesBtn">Rules</button>
      <a class="chipbtn" id="padLink" target="_blank" rel="noopener">SudokuPad ↗</a>
      <a class="chipbtn" id="videoLink" target="_blank" rel="noopener" hidden>Watch solve ↗</a>
      <a class="chipbtn" id="ctcLink" target="_blank" rel="noopener">Source ↗</a>
      <button class="chipbtn" id="shareBtn">Share</button>
    </div>

    <div class="sheet" id="rulesSheet" hidden>
      <div class="sheet-inner">
        <div class="sheet-grab"></div>
        <div class="sheet-head">
          <h2>Rules</h2>
          <button class="icon-btn" id="rulesClose" aria-label="Close rules">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="sheet-body" id="rulesBody"></div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast" role="status"></div>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
