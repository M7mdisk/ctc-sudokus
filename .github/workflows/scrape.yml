name: Refresh puzzle index

on:
  schedule:
    - cron: "17 6 * * *"      # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Refetch every puzzle page (slow, ~15 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape
        run: python3 scripts/scrape.py ${{ inputs.full && '--full' || '' }}

      - name: Sanity-check the index
        run: |
          python3 - <<'PY'
          import json, sys
          blob = json.load(open("data/puzzles.json"))
          items = blob["items"]
          assert len(items) > 3000, f"only {len(items)} puzzles - upstream markup likely changed"
          bad = [i for i in items if len(i) < 7]
          assert not bad, f"malformed rows: {bad[:1]}"
          no_pad = sum(1 for i in items if not i[6])
          print(f"ok: {len(items)} puzzles, latest {blob['latest']}, {no_pad} without a SudokuPad id")
          PY

      - name: Commit changes
        run: |
          git config user.name  "ctc-scraper"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "no changes"
            exit 0
          fi
          git add data/
          git commit -m "data: refresh puzzle index ($(date -u +%Y-%m-%d))"
          git push
